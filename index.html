<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pases">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pases de salida</title>
<style>
:root{
  --ink:#0E2A33;
  --ink-soft:#456068;
  --paper:#EEF2F1;
  --surface:#FFFFFF;
  --line:#D3DCDB;
  --teal:#12796B;
  --ochre:#B9762A;
  --alert:#A63A2B;
  --radius:14px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 90px) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 0}

/* ---------- encabezado ---------- */
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.gear{background:none;border:none;font-size:20px;padding:6px;cursor:pointer;color:var(--ink-soft);line-height:1}

/* ---------- reloj (elemento firma) ---------- */
.clock{
  background:var(--ink);color:#fff;border-radius:var(--radius);
  padding:22px 20px 18px;position:relative;overflow:hidden;
}
.clock .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.62}
.clock .hour{
  font-family:var(--mono);font-size:clamp(52px,17vw,74px);font-weight:600;
  letter-spacing:-.03em;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums;
}
.clock .sub{font-size:13px;opacity:.72}
.clock.done .hour{color:#FF9C8A}

/* barra de la quincena */
.gauge{margin-top:18px}
.gauge .track{height:9px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;display:flex}
.gauge .fill{background:var(--ochre);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.gauge .today{background:#E8B87A}
.gauge .nums{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
.card h2{font-size:12px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 12px;font-weight:600}

/* ---------- formulario ---------- */
.row{display:flex;gap:10px}
.field{flex:1;min-width:0}
label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
input,select{
  width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
}
input[type=time],input[type=date]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input:focus,select:focus,button:focus-visible{outline:2.5px solid var(--teal);outline-offset:1px}
.cost{
  margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--paper);
  border:1px dashed var(--line);font-size:13.5px;color:var(--ink-soft);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.cost b{font-family:var(--mono);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.cost.bad{border-color:var(--alert);color:var(--alert)}
.cost.bad b{color:var(--alert)}
.btn{
  width:100%;margin-top:12px;padding:14px;border:none;border-radius:11px;
  background:var(--teal);color:#fff;font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;
}
.btn:disabled{background:#9FB4B1;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);font-weight:500;font-size:14px;padding:11px}

/* ---------- lista ---------- */
ul{list-style:none;margin:0;padding:0}
li.pase{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
li.pase:last-child{border-bottom:none}
li.pase.hoy{margin:0 -16px;padding:11px 16px;background:#FBF6EE;border-left:3px solid var(--ochre)}
.d{font-family:var(--mono);font-size:12px;color:var(--ink-soft);width:44px;flex:none;text-align:center;font-variant-numeric:tabular-nums}
.d span{display:block;font-size:17px;color:var(--ink);line-height:1.1;font-weight:600}
.body{flex:1;min-width:0}
.body .t{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.body .m{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.min{font-family:var(--mono);font-size:14px;color:var(--ochre);font-variant-numeric:tabular-nums;flex:none}
.del{background:none;border:none;color:var(--ink-soft);font-size:19px;padding:4px 2px 4px 8px;cursor:pointer;line-height:1;flex:none}
.empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:18px 6px}

/* ---------- historial ---------- */
.hist{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist:last-child{border-bottom:none}
.hist .q{flex:1}
.hist .bar{width:78px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.hist .bar i{display:block;height:100%;background:var(--teal)}
.hist .n{font-family:var(--mono);font-size:12px;color:var(--ink-soft);width:66px;text-align:right;flex:none;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(14,42,51,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet p.note{font-size:13px;color:var(--ink-soft);margin:0 0 16px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(120%);
  bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:11px;font-size:14px;z-index:99;transition:transform .28s;
  max-width:90vw;text-align:center;
}
.toast.on{transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:11.5px;color:var(--ink-soft);padding:22px 0 8px;font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow" id="qLabel">—</div>
      <div style="font-size:13px;color:var(--ink-soft)" id="qRange">—</div>
    </div>
    <button class="gear" id="btnCfg" aria-label="Ajustes">⚙︎</button>
  </header>

  <section class="clock" id="clock">
    <div class="lbl">Puedes salir hoy desde las</div>
    <div class="hour" id="bigHour">--:--</div>
    <div class="sub" id="bigSub">—</div>
    <div class="gauge">
      <div class="track"><i class="fill" id="fillPrev" style="width:0"></i><i class="fill today" id="fillToday" style="width:0"></i></div>
      <div class="nums"><span id="gUsed">0 min usados</span><span id="gLeft">475 min libres</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Registrar pase</h2>
    <div class="row">
      <div class="field">
        <label for="fFecha">Fecha</label>
        <input type="date" id="fFecha">
      </div>
      <div class="field">
        <label for="fHora">Salgo a las</label>
        <input type="time" id="fHora">
      </div>
    </div>
    <div class="field" style="margin-top:10px">
      <label for="fMotivo">Motivo (opcional)</label>
      <input type="text" id="fMotivo" placeholder="Trámite, cita, personal…" maxlength="60">
    </div>
    <div class="cost" id="cost"><span id="costTxt">Elige una hora</span><b id="costMin">—</b></div>
    <button class="btn" id="btnAdd" disabled>Guardar pase</button>
  </section>

  <section class="card">
    <h2>Pases de esta quincena · <span id="nPases">0</span></h2>
    <ul id="lista"></ul>
  </section>

  <section class="card" id="cardHist" hidden>
    <h2>Quincenas anteriores</h2>
    <div id="hist"></div>
  </section>

  <footer>Todo se guarda en este teléfono</footer>
</div>

<!-- Ajustes -->
<div class="modal" id="modal">
  <div class="sheet">
    <h3>Ajustes</h3>
    <p class="note">Los pases ya registrados conservan los minutos con los que se guardaron.</p>
    <div class="row">
      <div class="field">
        <label for="cTope">Tope por quincena</label>
        <input type="number" id="cTope" min="1" max="9999" step="5">
      </div>
      <div class="field">
        <label for="cHora">Salida oficial</label>
        <input type="time" id="cHora">
      </div>
    </div>
    <button class="btn" id="btnSave">Guardar ajustes</button>
    <button class="btn ghost" id="btnExport">Descargar respaldo</button>
    <button class="btn ghost" id="btnImport">Restaurar respaldo</button>
    <input type="file" id="fileIn" accept="application/json" hidden>
    <button class="btn ghost" id="btnClose">Cerrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- almacenamiento (con respaldo en memoria) ---------- */
var mem = {};
var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
};

var DEF = { tope:475, horaOficial:"20:30" };
var cfg = Object.assign({}, DEF, JSON.parse(store.get("pases.cfg") || "{}"));
var pases = JSON.parse(store.get("pases.data") || "[]");

function guardar(){
  store.set("pases.cfg", JSON.stringify(cfg));
  store.set("pases.data", JSON.stringify(pases));
}

/* ---------- fechas y quincenas ---------- */
function hoyISO(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function partes(iso){ var p = iso.split("-"); return {y:+p[0], m:+p[1], d:+p[2]}; }
function ultimoDia(y,m){ return new Date(y, m, 0).getDate(); }

function quincena(iso){
  var p = partes(iso);
  if (p.d <= 15) return { id: p.y+"-"+String(p.m).padStart(2,"0")+"-Q1", ini:1, fin:15, y:p.y, m:p.m, n:1 };
  return { id: p.y+"-"+String(p.m).padStart(2,"0")+"-Q2", ini:16, fin:ultimoDia(p.y,p.m), y:p.y, m:p.m, n:2 };
}
var MESES = ["","enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function nombreQ(q){ return q.n + "ª quincena · " + MESES[q.m] + " " + q.y; }
function rangoQ(q){ return String(q.ini).padStart(2,"0") + " – " + q.fin + " de " + MESES[q.m]; }

/* ---------- minutos ---------- */
function aMin(hhmm){ var p = hhmm.split(":"); return (+p[0])*60 + (+p[1]); }
function aHora(min){
  min = Math.max(0, Math.min(1439, Math.round(min)));
  return String(Math.floor(min/60)).padStart(2,"0") + ":" + String(min%60).padStart(2,"0");
}
function costo(hhmm){ return Math.max(0, aMin(cfg.horaOficial) - aMin(hhmm)); }
function fmt(min){
  var h = Math.floor(min/60), m = min%60;
  if (h && m) return h + " h " + m + " min";
  if (h) return h + " h";
  return m + " min";
}

/* ---------- estado ---------- */
function delaQuincena(iso){
  var qid = quincena(iso).id;
  return pases.filter(function(p){ return quincena(p.fecha).id === qid; })
              .sort(function(a,b){ return a.fecha === b.fecha ? a.hora.localeCompare(b.hora) : a.fecha.localeCompare(b.fecha); });
}
function usados(iso){ return delaQuincena(iso).reduce(function(s,p){ return s + p.min; }, 0); }

/* ---------- render ---------- */
var $ = function(id){ return document.getElementById(id); };

function render(){
  var hoy = hoyISO();
  var q = quincena(hoy);
  var lista = delaQuincena(hoy);
  var us = usados(hoy);
  var libre = Math.max(0, cfg.tope - us);
  var hoyMin = lista.filter(function(p){ return p.fecha === hoy; }).reduce(function(s,p){ return s + p.min; }, 0);

  $("qLabel").textContent = nombreQ(q);
  $("qRange").textContent = rangoQ(q) + " · tope " + cfg.tope + " min";

  /* reloj: hora más temprana de salida posible hoy con el saldo restante */
  var clock = $("clock");
  if (libre === 0){
    clock.classList.add("done");
    $("bigHour").textContent = cfg.horaOficial;
    $("bigSub").textContent = "Sin saldo. Toca salir a la hora oficial.";
  } else {
    clock.classList.remove("done");
    $("bigHour").textContent = aHora(aMin(cfg.horaOficial) - libre);
    $("bigSub").textContent = "Te quedan " + fmt(libre) + " de los " + cfg.tope + " min de la quincena.";
  }

  var pPrev = Math.min(100, ((us - hoyMin) / cfg.tope) * 100);
  var pHoy  = Math.min(100 - pPrev, (hoyMin / cfg.tope) * 100);
  $("fillPrev").style.width = pPrev + "%";
  $("fillToday").style.width = pHoy + "%";
  $("gUsed").textContent = us + " min usados";
  $("gLeft").textContent = libre + " min libres";

  /* lista */
  $("nPases").textContent = lista.length;
  var ul = $("lista");
  ul.innerHTML = "";
  if (!lista.length){
    ul.innerHTML = '<li class="empty">Sin pases todavía. El saldo está completo.</li>';
  } else {
    lista.forEach(function(p){
      var pt = partes(p.fecha);
      var li = document.createElement("li");
      li.className = "pase" + (p.fecha === hoy ? " hoy" : "");
      li.innerHTML =
        '<div class="d">' + MESES[pt.m].slice(0,3) + '<span>' + String(pt.d).padStart(2,"0") + '</span></div>' +
        '<div class="body"><div class="t">' + p.hora + ' → ' + p.horaOficial + '</div>' +
        '<div class="m">' + (p.motivo ? esc(p.motivo) : "Sin motivo") + '</div></div>' +
        '<div class="min">−' + p.min + '</div>' +
        '<button class="del" data-id="' + p.id + '" aria-label="Eliminar pase">×</button>';
      ul.appendChild(li);
    });
  }

  /* historial */
  var otras = {};
  pases.forEach(function(p){
    var pq = quincena(p.fecha);
    if (pq.id === q.id) return;
    if (!otras[pq.id]) otras[pq.id] = { q:pq, tot:0, n:0 };
    otras[pq.id].tot += p.min;
    otras[pq.id].n++;
  });
  var keys = Object.keys(otras).sort().reverse();
  $("cardHist").hidden = keys.length === 0;
  $("hist").innerHTML = keys.slice(0,12).map(function(k){
    var o = otras[k];
    var pct = Math.min(100, (o.tot / cfg.tope) * 100);
    return '<div class="hist"><div class="q">' + nombreQ(o.q) + '</div>' +
           '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
           '<div class="n">' + o.tot + ' min</div></div>';
  }).join("");

  calcularCosto();
}

function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---------- costo en vivo ---------- */
function calcularCosto(){
  var hora = $("fHora").value;
  var fecha = $("fFecha").value || hoyISO();
  var box = $("cost"), txt = $("costTxt"), num = $("costMin"), btn = $("btnAdd");
  box.classList.remove("bad");

  if (!hora){ txt.textContent = "Elige una hora"; num.textContent = "—"; btn.disabled = true; return; }

  var c = costo(hora);
  if (c === 0){
    box.classList.add("bad");
    txt.textContent = "Esa hora ya es la salida oficial o después";
    num.textContent = "0 min";
    btn.disabled = true;
    return;
  }
  var libre = Math.max(0, cfg.tope - usados(fecha));
  if (c > libre){
    box.classList.add("bad");
    txt.textContent = "Excede el saldo. Como máximo hasta las " + aHora(aMin(cfg.horaOficial) - libre);
    num.textContent = "−" + c + " min";
    btn.disabled = true;
    return;
  }
  txt.textContent = "Descuenta de la quincena · quedarían " + (libre - c) + " min";
  num.textContent = "−" + c + " min";
  btn.disabled = false;
}

/* ---------- acciones ---------- */
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}

$("btnAdd").onclick = function(){
  var fecha = $("fFecha").value || hoyISO();
  var hora = $("fHora").value;
  if (!hora) return;
  var c = costo(hora);
  if (c <= 0 || c > cfg.tope - usados(fecha)) return;

  pases.push({
    id: Date.now() + "" + Math.floor(Math.random()*1000),
    fecha: fecha, hora: hora, min: c,
    horaOficial: cfg.horaOficial,
    motivo: $("fMotivo").value.trim()
  });
  guardar();
  $("fHora").value = "";
  $("fMotivo").value = "";
  render();
  toast("Pase guardado · −" + c + " min");
};

$("lista").onclick = function(e){
  var b = e.target.closest(".del");
  if (!b) return;
  var p = pases.find(function(x){ return x.id === b.dataset.id; });
  if (!p) return;
  if (!confirm("¿Eliminar el pase del " + p.fecha.split("-").reverse().join("/") + " a las " + p.hora + "?")) return;
  pases = pases.filter(function(x){ return x.id !== b.dataset.id; });
  guardar();
  render();
  toast("Pase eliminado · +" + p.min + " min");
};

$("fHora").oninput = calcularCosto;
$("fFecha").onchange = calcularCosto;

/* ---------- ajustes ---------- */
$("btnCfg").onclick = function(){
  $("cTope").value = cfg.tope;
  $("cHora").value = cfg.horaOficial;
  $("modal").classList.add("on");
};
$("btnClose").onclick = function(){ $("modal").classList.remove("on"); };
$("modal").onclick = function(e){ if (e.target === this) this.classList.remove("on"); };

$("btnSave").onclick = function(){
  var t = parseInt($("cTope").value, 10);
  var h = $("cHora").value;
  if (!t || t < 1 || !h){ toast("Revisa el tope y la hora"); return; }
  cfg.tope = t;
  cfg.horaOficial = h;
  guardar();
  $("modal").classList.remove("on");
  render();
  toast("Ajustes guardados");
};

$("btnExport").onclick = function(){
  var blob = new Blob([JSON.stringify({ cfg:cfg, pases:pases, v:1 }, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pases-respaldo-" + hoyISO() + ".json";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
};

$("btnImport").onclick = function(){ $("fileIn").click(); };
$("fileIn").onchange = function(e){
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      if (!Array.isArray(d.pases)) throw 0;
      pases = d.pases;
      cfg = Object.assign({}, DEF, d.cfg || {});
      guardar();
      $("modal").classList.remove("on");
      render();
      toast("Respaldo restaurado · " + pases.length + " pases");
    } catch(err){ toast("El archivo no es un respaldo válido"); }
  };
  r.readAsText(f);
  e.target.value = "";
};

/* ---------- arranque ---------- */
$("fFecha").value = hoyISO();
render();
setInterval(function(){
  if ($("fFecha").value === "" ) $("fFecha").value = hoyISO();
  render();
}, 60000);

/* instalable y offline */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
